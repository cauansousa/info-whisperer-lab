[package]
name = "app"
version = "0.1.4"
description = "Knowledge AI — Enterprise RAG desktop client"
authors = ["Cauan Sousa"]
license = "MIT"
repository = "https://github.com/cauanvinicius00/info-whisperer-lab"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
